repos:
# dogfood
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 4f85d46a92dc17713078e5de73f8a13190edf6fc  # frozen: 0.38.2
  hooks:
    - id: check-dependabot
    - id: check-github-workflows
    - id: check-github-workflows-require-timeout
    - id: check-readthedocs
    - id: check-metaschema
      name: Validate Vendored Schemas
      files: ^src/check_jsonschema/builtin_schemas/vendor/.*\.json$
      exclude: ^src/check_jsonschema/builtin_schemas/vendor/azure-pipelines\.json$
    - id: check-metaschema
      name: Validate Vendored Schemas (nonunicode regexes)
      files: ^src/check_jsonschema/builtin_schemas/vendor/azure-pipelines\.json$
      args: ["--regex-variant", "nonunicode"]
    - id: check-jsonschema
      name: Validate Test Configs
      args: ["--schemafile", "tests/example-files/config_schema.json"]
      files: ^tests/example-files/.*/_config.yaml$
- repo: https://github.com/pre-commit/pre-commit-hooks.git
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
    - id: check-merge-conflict
    - id: trailing-whitespace
- repo: https://github.com/psf/black-pre-commit-mirror
  rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88  # frozen: 26.10.1
  hooks:
    - id: black
- repo: https://github.com/PyCQA/flake8
  rev: cfbbfdeb2391c14a37e101e92a77f54f329e1726  # frozen: 7.4.1
  hooks:
    - id: flake8
      additional_dependencies:
        - 'flake8-bugbear==26.9.30'
        - 'flake8-typing-as-t==1.2.0'
        - 'flake8-comprehensions==3.17.0'
- repo: https://github.com/sirosen/slyp
  rev: 88fffb04eb1c7ec993922377ccdf2c50f1d452c4  # frozen: 0.10.3
  hooks:
    - id: slyp
- repo: https://github.com/PyCQA/isort
  rev: f97a190a40acf1ccdce6689df518a0321d41c1a3  # frozen: 10.0.0b1
  hooks:
    - id: isort
- repo: https://github.com/asottile/pyupgrade
  rev: f22ea0651f4355c655cc581f67813c991c74a312  # frozen: v3.22.0
  hooks:
    - id: pyupgrade
      args: ["--py311-plus"]
