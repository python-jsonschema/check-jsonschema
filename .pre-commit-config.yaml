repos:
# dogfood
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049  # frozen: 0.38.2
  hooks:
    - id: check-dependabot
    - id: check-github-workflows
    - id: check-github-workflows-require-timeout
    - id: check-readthedocs
    - id: check-metaschema
      name: Validate Vendored Schemas
      files: ^src/check_jsonschema/builtin_schemas/vendor/.*\.json$
      exclude: ^src/check_jsonschema/builtin_schemas/vendor/azure-pipelines\.json$
    - id: check-metaschema
      name: Validate Vendored Schemas (nonunicode regexes)
      files: ^src/check_jsonschema/builtin_schemas/vendor/azure-pipelines\.json$
      args: ["--regex-variant", "nonunicode"]
    - id: check-jsonschema
      name: Validate Test Configs
      args: ["--schemafile", "tests/example-files/config_schema.json"]
      files: ^tests/example-files/.*/_config.yaml$
- repo: https://github.com/pre-commit/pre-commit-hooks.git
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
    - id: check-merge-conflict
    - id: trailing-whitespace
- repo: https://github.com/psf/black-pre-commit-mirror
  rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88  # frozen: 26.10.1
  hooks:
    - id: black
- repo: https://github.com/PyCQA/flake8
  rev: 7eccf20b526fe4f2230bf9afeeef2fc9f97faf8d  # frozen: 7.4.1
  hooks:
    - id: flake8
      additional_dependencies:
        - 'flake8-bugbear==26.9.30'
        - 'flake8-typing-as-t==1.2.0'
        - 'flake8-comprehensions==3.17.0'
- repo: https://github.com/sirosen/slyp
  rev: 5eda35ad8f51f572b10523884f466df187335f74  # frozen: 0.10.3
  hooks:
    - id: slyp
- repo: https://github.com/PyCQA/isort
  rev: 9f905615631c545f5aea2516508109350d1d2f7d  # frozen: 9.0.2
  hooks:
    - id: isort
- repo: https://github.com/asottile/pyupgrade
  rev: f22ea0651f4355c655cc581f67813c991c74a312  # frozen: v3.22.0
  hooks:
    - id: pyupgrade
      args: ["--py310-plus"]
